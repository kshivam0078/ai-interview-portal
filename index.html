<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mentors Eduserv — Online Interview Assessment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/png" href="https://ranneeti.mentorsedu.com/img/ME-Circle_Orange.png">
<style>
  :root{--orange:#f97316;--orange-dark:#c2410c;--bg:#0e0e11;--card:#1c1612;--text:#e5e7eb;--muted:#9ca3af}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#151210,#0e0e11);color:var(--text);min-height:100vh;position:relative}
  body::before{content:'';position:fixed;inset:0;background:url('https://ranneeti.mentorsedu.com/img/ME-Circle_Orange.png') center center no-repeat;background-size:min(70vw,560px);opacity:.045;pointer-events:none;z-index:0}
  .center-wrap{position:relative;z-index:1}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:520px}
  .brand{text-align:center;margin-bottom:18px}
  .brand b{color:var(--orange);font-size:20px}
  .brand small{display:block;color:var(--muted);margin-top:4px}
  .card{background:linear-gradient(160deg,rgba(28,22,18,.94),rgba(14,14,17,.97));border:1px solid rgba(249,115,22,.28);border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  h2{margin:0 0 6px;font-size:19px}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:700;color:#fdba74;margin:14px 0 6px}
  input[type=text],input[type=email],textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:#fff;font-size:14px}
  textarea{min-height:110px;resize:vertical}
  .btn{margin-top:20px;width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(249,115,22,.35)}
  .btn:active:not(:disabled){transform:translateY(0);box-shadow:none}
  .btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
  .ghost-btn,.exam-actions button:not(.btn){transition:background .15s ease,transform .15s ease}
  .ghost-btn:hover,.exam-actions button:not(.btn):hover{transform:translateY(-1px)}
  #examBody,.question-card{animation:fadeSlideIn .25s ease}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#e5e7eb}
  .btn.small{margin-top:0;width:auto;padding:8px 14px;font-size:12.5px}
  .err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px}
  .hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}
  .center{text-align:center}
  .score{font-size:40px;font-weight:900;color:var(--orange);margin:10px 0}
  .logo{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 8px 22px rgba(249,115,22,.35);padding:6px}

  @keyframes spin{to{transform:rotate(360deg)}}
  .footer-note{text-align:center;margin-top:16px;font-size:11px;color:#6b7280}
  .footer-note b{color:#9ca3af}
  .err-icon{width:44px;height:44px;border-radius:50%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px}
  #qBody{-webkit-user-select:none;user-select:none}
  textarea,input{-webkit-user-select:text;user-select:text}
  .blur-guard{filter:blur(0);transition:filter .15s ease}

  .exam-shell.active{display:grid}
  .exam-main{padding:24px 32px;display:flex;flex-direction:column}
  .exam-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:20px}
  .exam-header-left{display:flex;align-items:center;gap:10px}

  .exam-header-left small{display:block;color:var(--muted);font-size:11px}

  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .qnum{font-size:12px;color:var(--muted)}
  .timer{font-weight:800;color:#fdba74;font-size:13px}
  .timer.low{color:#f87171}

  .exam-actions .btn{margin-top:0;width:auto;flex:1;min-width:140px}
  .flag-btn{background:transparent;border:1px solid rgba(250,204,21,.4);color:#facc15}
  .flag-btn.flagged{background:rgba(250,204,21,.15)}
  .skip-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#e5e7eb}

  /* ---- Sidebar question navigator ---- */
  .exam-sidebar{background:rgba(0,0,0,.25);border-left:1px solid rgba(255,255,255,.08);padding:22px 18px;display:flex;flex-direction:column}
  .sidebar-candidate{margin-bottom:16px}
  .sidebar-candidate b{display:block;font-size:14px;color:#fff}
  .sidebar-candidate small{color:var(--muted);font-size:11px}
  .sidebar-progress-text{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.6}
  .sidebar-progress-text b{color:#fdba74}
  .qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
  .qblock{aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;background:rgba(255,255,255,.03);transition:transform .12s ease,background .15s ease,border-color .15s ease}
  .qblock:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35)}

  .qblock.skipped{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:var(--muted)}

  .qlegend{font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
  .qlegend span{display:flex;align-items:center;gap:6px}
  .qlegend i{width:9px;height:9px;border-radius:3px;display:inline-block}

  /* ---- Review page ---- */
  .review-list{overflow-y:auto;flex:1}
  .review-item{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .review-item .rq{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .review-item b{font-size:13px}
  .review-item .ra{font-size:12.5px;color:var(--muted);margin-top:5px}
  .review-item .ra b{color:#e5e7eb}
  .review-edit{background:transparent;border:1px solid rgba(249,115,22,.4);color:var(--orange);padding:5px 12px;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap}

  @media(max-width:860px){
    .exam-shell.active{grid-template-columns:1fr}
    .exam-sidebar{border-left:none;border-top:1px solid rgba(255,255,255,.08);flex-direction:row;flex-wrap:wrap;align-items:center}
    .qgrid{grid-template-columns:repeat(8,1fr);flex:1}
    .qlegend{display:none}
  }
</style>

<script>
// ======================================================================
// Mentors Eduserv — Online Interview Assessment (externally hosted)
//
// Hosted outside Apps Script entirely so Google's unremovable "This
// application was created by a Google Apps Script user" banner (which
// lives in a different, cross-origin frame from any Apps-Script-served
// page's own content, and so can never be reached/hidden by that page's
// own JS) never appears here. All actual data/scoring logic still lives
// in the HRMS's Apps Script project — this page only talks to it over a
// plain JSON HTTP API (doPost in 09_WebApp.js), not google.script.run
// (which only works for pages Apps Script itself serves).
// ======================================================================

// TODO after first deploy: replace with the live Apps Script /exec URL.
const API_URL = 'https://script.google.com/macros/s/AKfycbxN7oQL8SMuh1RCBgZhPD8UvvyxqzZffjE2AySFFFA6tHcFoC1K76LOGedLtO2b11-s/exec';
const SUPPORT_EMAIL_ = 'mailmannu02@gmail.com';

function getSessionIdFromUrl_(){
  return new URLSearchParams(window.location.search).get('session') || '';
}
const SESSION_ID = getSessionIdFromUrl_();
let PORTAL_TOKEN = sessionStorage.getItem('aiInterviewToken_' + SESSION_ID) || '';
let SESSION_DEADLINE_ = null; // Date
let LOGIN_TIME_ = null; // Date — used only to show "Total: Xm" alongside the live countdown
let TOTAL_DURATION_MIN_ = null;
let QUESTIONS = [];
let ANSWERS = {};   // questionId -> {selectedOption|answerText, elapsedSeconds, skipped:bool}
let FLAGS = {};     // questionId -> true
let Q_INDEX = 0;
let TIMER = null;
let OVERALL_TIMER = null;
let CAM_STREAM = null;
let SCREEN_STREAM = null;
let Q_START_TIME_ = null;
let RECORDER = null;
let SCREEN_RECORDER = null;
let REC_CHUNK_INDEX_ = 0;
let SCREEN_CHUNK_INDEX_ = 0;
let DEVICE_FINGERPRINT_ = null;
let LOGIN_LOCATION_ = '';
let INTEGRITY_CHECK_INTERVAL_ = null;
let SUBMITTING_ = false;

// Plain HTTP call to the Apps Script JSON API. Content-Type: text/plain
// is deliberate — a "simple request" (GET or POST with text/plain,
// application/x-www-form-urlencoded, or multipart/form-data) needs no
// CORS preflight, which Apps Script's doPost has no way to answer.
// application/json would trigger a preflight OPTIONS request and fail.
// Google occasionally serves an HTML page instead of doPost's JSON for a
// single request - a transient redirect/quota hiccup, not a real failure
// (confirmed: the next identical request normally succeeds). Retrying
// once or twice silently fixes almost all of these; only a final,
// still-failing attempt surfaces a real (human-readable, not a raw JSON
// parse error) message.
async function callApi(action, ...args){
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++){
    let text;
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, args })
      });
      text = await res.text();
    }catch(networkErr){
      // Genuine network failure - worth retrying.
      lastErr = networkErr;
      if (attempt < 2) { await new Promise(r=>setTimeout(r, 700 * (attempt + 1))); continue; }
      throw lastErr;
    }
    let json;
    try{ json = JSON.parse(text); }
    catch(parseErr){
      // Transient Google redirect/quota hiccup returning an HTML page
      // instead of doPost's JSON - retry, it normally resolves itself.
      lastErr = new Error('The server sent back an unexpected response - please try again in a moment.');
      if (attempt < 2) { await new Promise(r=>setTimeout(r, 700 * (attempt + 1))); continue; }
      throw lastErr;
    }
    // A real application error (wrong code, expired session, etc.) is not
    // transient - surface it immediately, no point retrying the same
    // rejection three times with delays in between.
    if (!json.ok) throw new Error(json.error || 'Request failed.');
    return json.result;
  }
  throw lastErr;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function app(){ return document.getElementById('app'); }
function examBody(){ return document.getElementById('examBody'); }

function showLoginShell_(){
  document.getElementById('centerWrap').style.display = 'flex';
  document.getElementById('examShell').classList.remove('active');
}
function showExamShell_(){
  document.getElementById('centerWrap').style.display = 'none';
  document.getElementById('examShell').classList.add('active');
}

function isMobileDevice_(){
  return /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
}
function renderMobileBlock_(){
  app().innerHTML = `
    <div class="center" style="text-align:center;padding:10px 0">
      <div style="font-size:40px;margin-bottom:10px">💻</div>
      <h2>Please use a desktop or laptop</h2>
      <p class="sub">This assessment uses camera and screen monitoring that only works reliably on a desktop/laptop browser. Please open this same link on a computer to continue.</p>
    </div>`;
}

function computeDeviceFingerprint_(){
  try{
    return [navigator.userAgent, screen.width+'x'+screen.height, navigator.language, Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency||''].join('|');
  }catch(e){ return 'unknown'; }
}
async function fetchRoughLocation_(){
  try{
    const res = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
    if (!res.ok) return '';
    const j = await res.json();
    return [j.city, j.region, j.country_name].filter(Boolean).join(', ');
  }catch(e){ return ''; }
}
function startIntegrityChecks_(){
  clearInterval(INTEGRITY_CHECK_INTERVAL_);
  INTEGRITY_CHECK_INTERVAL_ = setInterval(async ()=>{
    if (!PORTAL_TOKEN) return;
    const loc = await fetchRoughLocation_();
    try{ await callApi('checkIntegrity', SESSION_ID, PORTAL_TOKEN, computeDeviceFingerprint_(), loc); }catch(e){}
  }, 5*60000);
}

function renderLogin(err){
  showLoginShell_();
  app().innerHTML = `
    <h2>Welcome</h2>
    <p class="sub">Enter the email and access code from your invitation email.</p>
    <label>Email address</label>
    <input type="email" id="liEmail" placeholder="you@example.com">
    <label>Access code</label>
    <input type="text" id="liCode" placeholder="10-character code">
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <button class="btn" id="liBtn">Continue</button>
    <div class="hint" style="border:1px solid var(--orange);background:rgba(249,115,22,.06)">⚠️ Please use <b>Google Chrome</b> on a desktop/laptop. This assessment needs camera, microphone and screen-sharing access, which other browsers (such as Safari) may block or not prompt for correctly. Also sit alone in a quiet place — background voices/noise and switching away are flagged.</div>
    <div class="hint">This assessment requires camera and microphone access for the full session, used for identity verification and recorded for review purposes only - never shared beyond Mentors Eduserv HR.</div>
    <p class="sub" style="margin-top:14px;font-size:11px">Trouble logging in or any other issue? Email HR support at <b>${SUPPORT_EMAIL_}</b>.</p>
  `;
  document.getElementById('liBtn').onclick = doLogin;
}

let LOGIN_IN_FLIGHT_ = false;
async function doLogin(){
  // Each login call generates a brand-new portal token server-side and
  // overwrites the stored one - a double-click (or a slow first attempt
  // tempting an impatient second click) fires two logins whose responses
  // can resolve out of order, leaving the client holding a DIFFERENT
  // token than the one the server actually kept. Every later action then
  // fails with "Session expired" even though nothing is really wrong.
  // Blocking re-entry here removes that race outright.
  if (LOGIN_IN_FLIGHT_) return;
  LOGIN_IN_FLIGHT_ = true;
  const email = document.getElementById('liEmail').value.trim();
  const code = document.getElementById('liCode').value.trim();
  if (!email || !code){ LOGIN_IN_FLIGHT_ = false; renderLogin('Please enter both your email and access code.'); return; }
  app().innerHTML = '<div class="center"><div class="spinner"></div><p class="sub" style="margin-top:8px">Verifying...</p></div>';
  DEVICE_FINGERPRINT_ = computeDeviceFingerprint_();
  LOGIN_LOCATION_ = await fetchRoughLocation_();
  try{
    const res = await callApi('login', SESSION_ID, email, code, DEVICE_FINGERPRINT_, LOGIN_LOCATION_);
    PORTAL_TOKEN = res.portalToken;
    sessionStorage.setItem('aiInterviewToken_' + SESSION_ID, PORTAL_TOKEN);
    LOGIN_TIME_ = new Date();
    if (res.sessionDeadline){
      SESSION_DEADLINE_ = new Date(res.sessionDeadline);
      TOTAL_DURATION_MIN_ = Math.max(1, Math.round((SESSION_DEADLINE_.getTime() - LOGIN_TIME_.getTime()) / 60000));
    }
    renderIntro(res.candidateName, res.jobTitle);
  }catch(e){ renderLogin(e.message || String(e)); }
  finally{ LOGIN_IN_FLIGHT_ = false; }
}

function renderIntro(name, jobTitle){
  const displayName = (name || '').trim() || 'there';
  const hasJob = !!(jobTitle || '').trim();
  document.getElementById('sbCandidateName').textContent = name || 'Candidate';
  document.getElementById('sbJobTitle').textContent = jobTitle || '';
  app().innerHTML = `
    <h2>Hi ${esc(displayName)}, 👋</h2>
    <p class="sub">${hasJob ? `Thank you for applying for <b>${esc(jobTitle)}</b> at Mentors Eduserv. You're about to begin your online assessment.` : `You're about to begin your online assessment at Mentors Eduserv.`}</p>
    <div class="hint">
      &bull; <b>Total time for this assessment: ${TOTAL_DURATION_MIN_ || '—'} minutes</b>, already counting down since you logged in. The remaining time stays visible at the top of the screen throughout.<br>
      &bull; <b>Camera, microphone and screen sharing are all mandatory</b> for this assessment and are recorded for review - you won't be able to start without granting all three.<br>
      &bull; Each question has its own time limit - it auto-advances when time runs out.<br>
      &bull; You can <b>skip</b> a question and come back to it later, and <b>flag</b> any question for your own review.<br>
      &bull; Before final submission you'll see a review screen with every question and your answer.<br>
      &bull; Copying question text and pasting into answers is disabled.<br>
      &bull; Complete it in one sitting - you won't be able to resume once you close this page, unless HR resets your session.
    </div>
    <p class="sub" style="margin-top:16px;text-align:center;color:var(--orange)">Take your time, stay focused, and best of luck! 🌟</p>
    <button class="btn" id="startBtn">Continue to Assessment</button>
    <div id="camErr"></div>
  `;
  document.getElementById('startBtn').onclick = requestCameraAndStart_;
}

async function requestCameraAndStart_(){
  const btn = document.getElementById('startBtn');
  const errBox = document.getElementById('camErr');
  btn.disabled = true; btn.textContent = 'Setting up...';
  try{
    CAM_STREAM = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  }catch(camErr){
    const name = camErr && camErr.name || '';
    const helpHtml = name === 'NotAllowedError'
      ? `Camera and microphone are currently <b>blocked for this site</b> in your browser. Tap the lock/info icon next to the address bar &rarr; Permissions &rarr; Camera/Microphone &rarr; Allow &rarr; then try again. <b>Both are mandatory</b> - the assessment can't start without them.`
      : `Camera and microphone could not be accessed on this device (${esc(name || 'unknown error')}). Please connect/enable a working camera and microphone, then try again.`;
    errBox.innerHTML = `<div class="err">${helpHtml}</div>`;
    logActivity_('camera_denied', String(name) + ' ' + String(camErr && camErr.message || camErr));
    CAM_STREAM = null;
    btn.disabled = false; btn.textContent = 'Continue to Assessment';
    return;
  }
  try{
    SCREEN_STREAM = await navigator.mediaDevices.getDisplayMedia({ video: true });
  }catch(screenErr){
    logActivity_('screen_share_declined', String(screenErr && screenErr.name || screenErr));
    errBox.innerHTML = `<div class="err">Screen sharing is <b>mandatory</b> for this assessment. Please click Continue again and choose "Share" when your browser asks - the assessment can't start without it.</div>`;
    CAM_STREAM.getTracks().forEach(t=>t.stop()); CAM_STREAM = null;
    btn.disabled = false; btn.textContent = 'Continue to Assessment';
    return;
  }
  {
    const v = document.getElementById('camPreview'); v.srcObject = CAM_STREAM; v.hidden = false;
    startRecording_();
  }
  {
    startScreenRecording_();
  }
  startIntegrityWatch_();
  startIntegrityChecks_();
  startOverallTimer_();
  loadQuestions();
}

// MediaRecorder's own `start(timeslice)` only writes a playable WebM header
// into the FIRST chunk it emits - every chunk after that is a headerless
// continuation fragment, which plays back as "unsupported format" when
// opened on its own (exactly what each "Part N" link was doing). The fix is
// to never let one recorder instance span multiple uploaded files: start a
// brand-new MediaRecorder for every ~60s segment and only upload once that
// instance's own onstop event fires, so every uploaded file has its own
// complete, independently playable header.
function uploadRecordingBlob_(blob, kind, idx){
  if (!blob || !blob.size) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const base64 = String(reader.result).split(',')[1];
    callApi('uploadRecordingChunk', SESSION_ID, PORTAL_TOKEN, base64, idx, kind).catch(()=>{});
  };
  reader.readAsDataURL(blob);
}

let CAM_SEGMENT_ACTIVE_ = false, CAM_SEGMENT_TIMER_ = null;
function startRecording_(){
  try{
    document.getElementById('recDot').hidden = false;
    CAM_SEGMENT_ACTIVE_ = true;
    recordCameraSegment_();
  }catch(e){}
}
function recordCameraSegment_(){
  if (!CAM_SEGMENT_ACTIVE_ || !CAM_STREAM) return;
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus' : 'video/webm';
  const chunks = [];
  const rec = new MediaRecorder(CAM_STREAM, { mimeType, videoBitsPerSecond: 250000 });
  rec.ondataavailable = e=>{ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    uploadRecordingBlob_(new Blob(chunks, { type: 'video/webm' }), 'camera', REC_CHUNK_INDEX_++);
    if (CAM_SEGMENT_ACTIVE_) recordCameraSegment_();
  };
  RECORDER = rec;
  rec.start();
  CAM_SEGMENT_TIMER_ = setTimeout(()=>{ try{ if (rec.state !== 'inactive') rec.stop(); }catch(e){} }, 60000);
}
function stopRecording_(){
  CAM_SEGMENT_ACTIVE_ = false;
  clearTimeout(CAM_SEGMENT_TIMER_);
  try{ if (RECORDER && RECORDER.state !== 'inactive') RECORDER.stop(); }catch(e){}
  document.getElementById('recDot').hidden = true;
}

let SCREEN_SEGMENT_ACTIVE_ = false, SCREEN_SEGMENT_TIMER_ = null;
function startScreenRecording_(){
  try{
    SCREEN_SEGMENT_ACTIVE_ = true;
    recordScreenSegment_();
    SCREEN_STREAM.getVideoTracks()[0]?.addEventListener('ended', ()=>terminateForViolation_('screen_share_stopped', 'You stopped screen sharing.'));
  }catch(e){}
}
function recordScreenSegment_(){
  if (!SCREEN_SEGMENT_ACTIVE_ || !SCREEN_STREAM) return;
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm';
  const chunks = [];
  const rec = new MediaRecorder(SCREEN_STREAM, { mimeType, videoBitsPerSecond: 200000 });
  rec.ondataavailable = e=>{ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    uploadRecordingBlob_(new Blob(chunks, { type: 'video/webm' }), 'screen', SCREEN_CHUNK_INDEX_++);
    if (SCREEN_SEGMENT_ACTIVE_) recordScreenSegment_();
  };
  SCREEN_RECORDER = rec;
  rec.start();
  SCREEN_SEGMENT_TIMER_ = setTimeout(()=>{ try{ if (rec.state !== 'inactive') rec.stop(); }catch(e){} }, 60000);
}
function stopScreenRecording_(){
  SCREEN_SEGMENT_ACTIVE_ = false;
  clearTimeout(SCREEN_SEGMENT_TIMER_);
  try{ if (SCREEN_RECORDER && SCREEN_RECORDER.state !== 'inactive') SCREEN_RECORDER.stop(); }catch(e){}
  try{ if (SCREEN_STREAM) SCREEN_STREAM.getTracks().forEach(t=>t.stop()); }catch(e){}
}

function logActivity_(eventType, detail){
  if (!PORTAL_TOKEN) return;
  callApi('logActivity', SESSION_ID, PORTAL_TOKEN, eventType, detail||'').catch(()=>{});
}

let INTEGRITY_WATCH_STARTED_=false;
let TERMINATING_=false;
// A tab switch, a stopped screen share, or a lost camera/mic feed isn't just
// logged anymore - it ends the assessment outright, with a brief on-screen
// warning first so the candidate understands what happened and why, then
// the same guaranteed-delivery submit path the overall-timer auto-submit uses.
function terminateForViolation_(reason, label){
  if (TERMINATING_ || SUBMITTING_) return;
  TERMINATING_ = true;
  logActivity_(reason, 'Assessment auto-terminated for this violation.');
  clearInterval(TIMER); clearInterval(OVERALL_TIMER);
  examBody().innerHTML = `<div class="center" style="padding:60px 0">
    <div class="err-icon">!</div>
    <h2>Assessment ended</h2>
    <p class="sub">${esc(label)} This is not allowed during the assessment, so it has been ended and your answers so far are being submitted automatically.</p>
  </div>`;
  setTimeout(()=>finalSubmitAll_(true), 2500);
}
function startIntegrityWatch_(){
  if (INTEGRITY_WATCH_STARTED_) return;
  INTEGRITY_WATCH_STARTED_=true;
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) terminateForViolation_('tab_hidden', 'You switched away from this tab/window.');
  });
  window.addEventListener('blur', ()=>{ document.body.classList.add('window-blurred'); logActivity_('window_blurred',''); });
  window.addEventListener('focus', ()=>{ document.body.classList.remove('window-blurred'); });
  document.addEventListener('contextmenu', e=>{ e.preventDefault(); logActivity_('context_menu_blocked',''); });
  document.addEventListener('copy', e=>{ e.preventDefault(); logActivity_('copy_blocked',''); });
  document.addEventListener('cut', e=>{ e.preventDefault(); logActivity_('cut_blocked',''); });
  document.addEventListener('paste', e=>{
    e.preventDefault();
    logActivity_('paste_blocked', e.target && e.target.id === 'txtAnswer' ? 'Attempted paste into a short-answer box.' : '');
  });
  document.addEventListener('keydown', e=>{
    const blocked = (e.key === 'PrintScreen') || (e.ctrlKey && e.shiftKey && ['I','J','C','S'].includes(e.key.toUpperCase())) || (e.metaKey && e.shiftKey);
    if (blocked){ e.preventDefault(); logActivity_('shortcut_blocked', e.key); }
  });
  if (CAM_STREAM){
    CAM_STREAM.getTracks().forEach(t=>{
      t.addEventListener('ended', ()=>terminateForViolation_('camera_or_mic_lost', 'Your camera/microphone feed was lost.'));
    });
  }
}

// ---- Overall session countdown (client-side mirror of the server deadline) ----
// Proactively triggers final submission ~20s BEFORE the server's own hard
// cutoff, so whatever's been answered so far is guaranteed to reach the
// backend instead of being lost if the server's deadline check fires
// first on some other call.
function startOverallTimer_(){
  if (!SESSION_DEADLINE_) return;
  const totalEl = document.getElementById('overallTimerTotal');
  if (totalEl && TOTAL_DURATION_MIN_) totalEl.textContent = `Total ${TOTAL_DURATION_MIN_}m · `;
  clearInterval(OVERALL_TIMER);
  OVERALL_TIMER = setInterval(()=>{
    const msLeft = SESSION_DEADLINE_.getTime() - Date.now();
    const wrap = document.getElementById('overallTimer');
    const remEl = document.getElementById('overallTimerRemaining');
    if (!wrap || !remEl) return;
    if (msLeft <= 0){
      clearInterval(OVERALL_TIMER);
      remEl.textContent = '00:00';
      finalSubmitAll_(true);
      return;
    }
    const totalSec = Math.floor(msLeft/1000);
    const mm = Math.floor(totalSec/60), ss = totalSec%60;
    remEl.textContent = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    wrap.classList.toggle('low', totalSec <= 120);
    if (totalSec <= 20 && !SUBMITTING_){ clearInterval(OVERALL_TIMER); finalSubmitAll_(true); }
  }, 1000);
}

async function loadQuestions(){
  showExamShell_();
  examBody().innerHTML = '<div class="center" style="padding:60px 0"><div class="spinner"></div><p class="sub" style="margin-top:8px">Loading questions...</p></div>';
  try{
    const res = await callApi('getQuestions', SESSION_ID, PORTAL_TOKEN);
    if (!res.questions || !res.questions.length){ renderFatalError_('No questions are available for this assessment yet.'); return; }
    QUESTIONS = res.questions;
    Q_INDEX = 0;
    renderSidebar_();
    renderQuestion();
  }catch(e){
    const msg = String(e && e.message || '');
    // The backend already force-completed this session (deadline passed,
    // or a prior attempt already finished it) - that's a DONE state, not
    // something to retry. Showing it as a dead-end error would send the
    // candidate in circles.
    if (/time limit.*was reached|already been submitted/i.test(msg)){ renderDone_(null); return; }
    if (/session expired/i.test(msg)){
      examBody().innerHTML = `<div class="center" style="padding:60px 0">
        <div class="err-icon">!</div>
        <h2>Session needs a refresh</h2>
        <p class="sub">Please log in again with the same access code - this won't restart your assessment.</p>
        <button class="btn" id="relogRetryBtn" style="max-width:260px;margin:16px auto 0">Log in again</button>
      </div>`;
      document.getElementById('relogRetryBtn').onclick = ()=>{ PORTAL_TOKEN = ''; sessionStorage.removeItem('aiInterviewToken_' + SESSION_ID); renderLogin(); };
      return;
    }
    examBody().innerHTML = `<div class="err">${esc(e.message||String(e))}</div>`;
  }
}

function captureSnapshot_(){
  try{
    if (!CAM_STREAM) return null;
    const v = document.getElementById('camPreview');
    const c = document.createElement('canvas'); c.width = 240; c.height = 180;
    c.getContext('2d').drawImage(v, 0, 0, 240, 180);
    return c.toDataURL('image/jpeg', 0.6);
  }catch(e){ return null; }
}

function renderSidebar_(){
  const grid = document.getElementById('qGrid');
  grid.innerHTML = QUESTIONS.map((q,i)=>{
    const a = ANSWERS[q.questionId];
    const cls = ['qblock'];
    if (i === Q_INDEX) cls.push('current');
    if (a && !a.skipped) cls.push('answered');
    else if (a && a.skipped) cls.push('skipped');
    const flagDot = FLAGS[q.questionId] ? '<span class="flag-dot"></span>' : '';
    return `<div class="${cls.join(' ')}" onclick="jumpToQuestion_(${i})">${i+1}${flagDot}</div>`;
  }).join('');
  const answeredCount = QUESTIONS.filter(q=>ANSWERS[q.questionId] && !ANSWERS[q.questionId].skipped).length;
  const flaggedCount = Object.keys(FLAGS).filter(k=>FLAGS[k]).length;
  document.getElementById('sbProgressText').innerHTML = `<b>${answeredCount}</b> of ${QUESTIONS.length} answered${flaggedCount?` &middot; <b>${flaggedCount}</b> flagged`:''}`;
}

function jumpToQuestion_(i){
  saveCurrentAnswerLocally_(false);
  Q_INDEX = i;
  renderQuestion();
}

function saveCurrentAnswerLocally_(skipped){
  const q = QUESTIONS[Q_INDEX];
  if (!q) return;
  const elapsedSeconds = Q_START_TIME_ ? Math.round((Date.now()-Q_START_TIME_)/1000) : null;
  if (skipped){
    if (!ANSWERS[q.questionId]) ANSWERS[q.questionId] = { skipped: true, elapsedSeconds };
    renderSidebar_();
    return;
  }
  if (q.type === 'MCQ'){
    const checked = document.querySelector('input[name=opt]:checked');
    if (checked) ANSWERS[q.questionId] = { selectedOption: checked.value, elapsedSeconds, skipped: false };
  } else if (q.type === 'MCQSubjective'){
    const checked = document.querySelector('input[name=opt]:checked');
    const txt = document.getElementById('txtAnswer');
    if (checked) ANSWERS[q.questionId] = { selectedOption: checked.value, answerText: (txt && txt.value.trim()) || '', elapsedSeconds, skipped: false };
  } else {
    const txt = document.getElementById('txtAnswer');
    if (txt && txt.value.trim()) ANSWERS[q.questionId] = { answerText: txt.value.trim(), elapsedSeconds, skipped: false };
  }
  renderSidebar_();
}

function toggleFlag_(){
  const q = QUESTIONS[Q_INDEX];
  FLAGS[q.questionId] = !FLAGS[q.questionId];
  renderSidebar_();
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[Q_INDEX];
  const existing = ANSWERS[q.questionId];
  const pct = Math.round(((Q_INDEX+1) / QUESTIONS.length) * 100);
  let bodyHtml = '';
  if (q.type === 'MCQ' || q.type === 'MCQSubjective'){
    const opts = [['A',q.optionA],['B',q.optionB],['C',q.optionC],['D',q.optionD],['E',q.optionE]].filter(o=>o[1]);
    bodyHtml = opts.map(o=>`<label class="opt${existing && existing.selectedOption===o[0]?' sel':''}" data-val="${o[0]}"><input type="radio" name="opt" value="${o[0]}" ${existing && existing.selectedOption===o[0]?'checked':''}> <span>${esc(o[1])}</span></label>`).join('');
    if (q.type === 'MCQSubjective'){
      bodyHtml += `<textarea id="txtAnswer" style="margin-top:14px" placeholder="Briefly explain your choice...">${esc(existing && existing.answerText || '')}</textarea>`;
    }
  } else if (q.type === 'FillBlank'){
    bodyHtml = `<input type="text" id="txtAnswer" class="fill-blank-input" placeholder="Type your answer here..." value="${esc(existing && existing.answerText || '')}" autocomplete="off">`;
  } else {
    bodyHtml = `<textarea id="txtAnswer" placeholder="Type your answer here...">${esc(existing && existing.answerText || '')}</textarea>`;
  }
  const isLast = Q_INDEX === QUESTIONS.length - 1;
  const flagged = !!FLAGS[q.questionId];
  examBody().innerHTML = `
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qhead"><span class="qnum">Question ${Q_INDEX+1} of ${QUESTIONS.length}</span><span class="timer" id="timerEl">${q.timeLimitSeconds}s</span></div>
    <h2>${esc(q.questionText)}</h2>
    <div id="qBody">${bodyHtml}</div>
    <div class="exam-actions">
      <button class="btn skip-btn" id="skipBtn">Skip for now</button>
      <button class="btn flag-btn${flagged?' flagged':''}" id="flagBtn">${flagged?'🚩 Flagged':'Flag for review'}</button>
      <button class="btn" id="nextBtn">${isLast?'Review & Submit':'Next Question'}</button>
    </div>
  `;
  if (q.type === 'MCQ'){
    document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel'); o.querySelector('input').checked = true;
    }));
  }
  document.getElementById('skipBtn').onclick = ()=>{ clearInterval(TIMER); saveCurrentAnswerLocally_(true); goNext_(); };
  document.getElementById('flagBtn').onclick = toggleFlag_;
  document.getElementById('nextBtn').onclick = ()=>{ clearInterval(TIMER); saveCurrentAnswerLocally_(false); isLast ? renderReview_() : goNext_(); };
  renderSidebar_();

  Q_START_TIME_ = Date.now();
  let timeLeft = q.timeLimitSeconds;
  clearInterval(TIMER);
  TIMER = setInterval(()=>{
    timeLeft--;
    const t = document.getElementById('timerEl');
    if (t){ t.textContent = timeLeft+'s'; if (timeLeft<=10) t.classList.add('low'); }
    if (timeLeft<=0){
      clearInterval(TIMER);
      saveCurrentAnswerLocally_(false);
      if (!ANSWERS[q.questionId]) saveCurrentAnswerLocally_(true); // nothing was selected in time - counts as skipped
      isLast ? renderReview_() : goNext_();
    }
  },1000);
}

function goNext_(){
  if (Q_INDEX < QUESTIONS.length - 1){ Q_INDEX++; renderQuestion(); }
  else renderReview_();
}

function renderReview_(){
  clearInterval(TIMER);
  const items = QUESTIONS.map((q,i)=>{
    const a = ANSWERS[q.questionId];
    const flagged = !!FLAGS[q.questionId];
    let answerLabel = '<i style="color:#f87171">Not answered</i>';
    if (a && !a.skipped){
      answerLabel = q.type === 'MCQ' ? `Option <b>${esc(a.selectedOption)}</b>`
        : q.type === 'MCQSubjective' ? `Option <b>${esc(a.selectedOption)}</b> — <b>${esc((a.answerText||'').slice(0,90))}${(a.answerText||'').length>90?'…':''}</b>`
        : `<b>${esc((a.answerText||'').slice(0,120))}${(a.answerText||'').length>120?'…':''}</b>`;
    }
    return `<div class="review-item">
      <div class="rq">
        <b>${i+1}. ${esc(q.questionText.slice(0,90))}${q.questionText.length>90?'…':''}</b>
        <button class="review-edit" onclick="jumpToQuestion_(${i})">Edit</button>
      </div>
      <div class="ra">${flagged?'🚩 Flagged &middot; ':''}${answerLabel}</div>
    </div>`;
  }).join('');
  const unanswered = QUESTIONS.filter(q=>!ANSWERS[q.questionId] || ANSWERS[q.questionId].skipped).length;
  examBody().innerHTML = `
    <h2>Review your answers</h2>
    <p class="sub">${unanswered>0?`${unanswered} question(s) not answered yet. `:''}Check everything below before final submission - you can't make changes after you submit.</p>
    <div class="review-list">${items}</div>
    <div class="exam-actions">
      <button class="btn" id="finalSubmitBtn">Final Submit</button>
    </div>
  `;
  document.getElementById('finalSubmitBtn').onclick = ()=>finalSubmitAll_(false);
  renderSidebar_();
}

// Sends every locally-held answer to the backend, then finalizes the
// session. Called either by the candidate's own Final Submit click, or
// automatically ~20s before the overall deadline so nothing is lost.
async function finalSubmitAll_(auto){
  if (SUBMITTING_) return;
  SUBMITTING_ = true;
  clearInterval(TIMER); clearInterval(OVERALL_TIMER);
  // Answers go out in parallel (fast - a few seconds for 20-25 questions
  // instead of the old one-at-a-time loop), but we still WAIT for every one
  // of them plus finishSession to actually land before telling the
  // candidate they're done. Rendering "submitted" before the network calls
  // finish is a trap: candidates close the tab the moment they see it,
  // killing the in-flight requests, and the session is stuck "In Progress"
  // forever because some answers never reached the server.
  examBody().innerHTML = `<div class="center" style="padding:60px 0"><div class="spinner"></div><p class="sub" style="margin-top:8px">${auto?'Time\'s up — submitting your answers...':'Submitting your assessment...'}</p></div>`;
  await Promise.all(QUESTIONS.map(q=>{
    const a = ANSWERS[q.questionId];
    if (!a || a.skipped) return Promise.resolve();
    const payload = { elapsedSeconds: a.elapsedSeconds };
    const snap = captureSnapshot_(); if (snap) payload.snapshotsBase64 = [snap];
    if (q.type === 'MCQ') payload.selectedOption = a.selectedOption;
    else if (q.type === 'MCQSubjective'){ payload.selectedOption = a.selectedOption; payload.answerText = a.answerText; }
    else payload.answerText = a.answerText;
    return callApiRetry_('submitAnswer', [SESSION_ID, PORTAL_TOKEN, q.questionId, payload]).catch(()=>{});
  }));
  stopRecording_(); stopScreenRecording_();
  try{
    const res = await callApiRetry_('finishSession', [SESSION_ID, PORTAL_TOKEN]);
    renderDone_(res);
  }catch(e){
    // These two messages are the backend reporting the submission as a
    // DONE DEAL, not a failure - "time limit reached" fires after it has
    // already force-completed the session server-side, and "already
    // submitted" means a prior attempt (e.g. an earlier retry) already
    // succeeded. Both were being shown as the scary "couldn't finalize"
    // error even though nothing needed retrying - the candidate's
    // submission had, in fact, gone through.
    const msg = String(e && e.message || '');
    if (/time limit.*was reached|already been submitted/i.test(msg)){
      renderDone_(null);
      return;
    }
    // Do NOT tell the candidate this is done when it isn't - that's exactly
    // what caused sessions to sit silently stuck "In Progress" with the
    // candidate believing everything had gone through. Give them a visible
    // retry instead; their answers are already saved server-side at this
    // point (submitAnswer succeeded above), only the final "mark complete"
    // step needs to land.
    SUBMITTING_ = false;
    renderSubmitError_(e && e.message);
  }
}

function renderSubmitError_(message){
  // A token mismatch ("Session expired") can't be fixed by Retry - it'll
  // just fail the exact same way again, since the client is still holding
  // the same wrong token. Offer a real way out: log back in with the same
  // access code, which issues a fresh, correctly-synced token.
  const isSessionIssue = /session expired/i.test(String(message || ''));
  examBody().innerHTML = `<div class="center" style="padding:60px 0">
    <div class="err-icon">!</div>
    <h2>Couldn't finalize your submission</h2>
    <p class="sub">${isSessionIssue
      ? `Your session needs to be refreshed before we can confirm your submission. Please log in again with the same access code - your progress is kept.`
      : `Your answers were saved, but we couldn't confirm the final submission because of a connection issue. Please don't close this tab - tap Retry below.`}</p>
    <button class="btn" id="retrySubmitBtn" style="max-width:260px;margin:16px auto 0">${isSessionIssue ? 'Log in again' : 'Retry'}</button>
    <p class="sub" style="margin-top:14px;font-size:12px">Still stuck? Contact HR support at <b>${SUPPORT_EMAIL_}</b>.</p>
  </div>`;
  document.getElementById('retrySubmitBtn').onclick = isSessionIssue ? ()=>{ SUBMITTING_ = false; PORTAL_TOKEN = ''; sessionStorage.removeItem('aiInterviewToken_' + SESSION_ID); renderLogin(); } : ()=>finalSubmitAll_(false);
}

// Wraps a callApi call with a few retries (network blips, not persistent
// failures) before giving up - used for the submission path specifically,
// where silently failing once used to look identical to succeeding.
async function callApiRetry_(action, args, retries){
  retries = retries == null ? 3 : retries;
  let lastErr;
  for (let i = 0; i < retries; i++){
    try{ return await callApi(action, ...args); }
    catch(e){ lastErr = e; if (i < retries - 1) await new Promise(r=>setTimeout(r, 700 * (i + 1))); }
  }
  throw lastErr;
}

function renderDone_(res){
  showLoginShell_();
  const hasScore = res && res.percentage != null;
  app().innerHTML = `
    <div class="center">
      <div style="font-size:40px">✅</div>
      <h2>Assessment submitted</h2>
      <p class="sub">Thank you for completing the assessment. HR will be in touch with next steps. You can safely close this tab now.</p>
      <div id="doneScoreBox">${hasScore?`<div class="score">${res.percentage}%</div><p class="sub">Your score (some answers may still need manual review)</p>`:''}</div>
      <p class="sub" style="margin-top:18px;font-size:12px">Facing a login or technical issue? Contact HR support at <b>${SUPPORT_EMAIL_}</b>.</p>
    </div>`;
}

function renderFatalError_(message){
  showLoginShell_();
  app().innerHTML = `<div class="center"><div class="err-icon">!</div><h2>${esc(message)}</h2><p class="sub">If you believe this is a mistake, please contact HR support at <b>${SUPPORT_EMAIL_}</b>.</p></div>`;
}

(function init(){
  if (!SESSION_ID){ renderFatalError_('This interview link is invalid or incomplete.'); return; }
  if (isMobileDevice_()){ showLoginShell_(); renderMobileBlock_(); return; }
  if (API_URL.indexOf('REPLACE_WITH') !== -1){ renderFatalError_('This portal is not fully configured yet. Please contact HR.'); return; }
  renderLogin();
})();
</script>
</body>
